name: Build

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    name: Build (${{ matrix.zkvm }})
    strategy:
      fail-fast: false
      matrix:
        zkvm: [Generic, Zisk, Sp1, OpenVm, Zisk+Sp1+OpenVm]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6

      - name: Build
        working-directory: src
        run: dotnet build -c release -warnaserror -p:Zisk=${{ contains(matrix.zkvm, 'Zisk') }} -p:Sp1=${{ contains(matrix.zkvm, 'Sp1') }} -p:OpenVm=${{ contains(matrix.zkvm, 'OpenVm') }}
